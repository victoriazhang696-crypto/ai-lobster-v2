<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI龙虾免费部署 - 科技改变生活</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f0fdf4;
            --card: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 加载遮罩层 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-icon {
            font-size: 80px;
            animation: bounce 1s ease-in-out infinite;
        }

        .loading-text {
            color: #fff;
            font-size: 24px;
            margin-top: 20px;
            font-weight: 600;
        }

        .loading-subtext {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-top: 10px;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots span {
            animation: dots 1.5s infinite;
            opacity: 0;
        }

        .loading-dots span:nth-child(1) { animation-delay: 0s; }
        .loading-dots span:nth-child(2) { animation-delay: 0.3s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.6s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes dots {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            padding: 50px 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .header .subtitle-zh {
            font-size: 18px;
            margin-bottom: 5px;
            opacity: 0.95;
        }

        .header .subtitle-en {
            font-size: 14px;
            opacity: 0.8;
            font-style: italic;
        }

        .form-section {
            padding: 40px;
        }

        .form-section h2 {
            font-size: 24px;
            color: var(--text);
            margin-bottom: 8px;
            text-align: center;
        }

        .form-section .subtitle {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 500;
        }

        .form-group label .required {
            color: #ef4444;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: #fafafa;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-hint {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 6px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 50px 40px;
        }

        .success-message .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .success-message h2 {
            color: var(--primary);
            margin-bottom: 15px;
        }

        .success-message p {
            color: var(--text-light);
        }

        .error-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #fecaca;
        }

        .features {
            padding: 30px 40px;
            background: #fafafa;
            border-top: 1px solid #e5e7eb;
        }

        .features h3 {
            font-size: 18px;
            color: var(--text);
            margin-bottom: 20px;
            text-align: center;
        }

        .feature-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .feature-item {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
        }

        .feature-item .icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-item .text {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 500;
        }

        .footer {
            text-align: center;
            padding: 25px;
            background: #fafafa;
            color: var(--text-light);
            font-size: 14px;
            border-top: 1px solid #e5e7eb;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 26px;
            }

            .form-section {
                padding: 30px 20px;
            }

            .feature-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 加载遮罩层 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-icon">🦞</div>
        <div class="loading-text">AI龙虾系统加载中</div>
        <div class="loading-subtext">
            正在为您准备最佳体验<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>🦞 AI龙虾免费部署，科技改变生活</h1>
            <p class="subtitle-zh">AI时代，让科技助力您的诗和远方</p>
            <p class="subtitle-en">In the AI Era, Let Technology Power Your Dreams</p>
        </div>

        <div class="form-section" id="formSection">
            <h2>立即预约</h2>
            <p class="subtitle">填写信息，我们将尽快与您联系</p>

            <div class="error-message" id="errorMessage"></div>

            <form id="reservationForm">
                <div class="form-group">
                    <label>电话 / WhatsApp <span class="required">*</span></label>
                    <input type="tel" id="phone" placeholder="请输入您的电话或WhatsApp号码">
                </div>

                <div class="form-group">
                    <label>邮箱 <span class="required">*</span></label>
                    <input type="email" id="email" placeholder="请输入您的邮箱地址">
                    <div class="form-hint">电话/WhatsApp 和邮箱至少填写一项</div>
                </div>

                <div class="form-group">
                    <label>备注信息</label>
                    <textarea id="notes" placeholder="请输入您的备注或选题（选填）"></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">提交预约</button>
            </form>
        </div>

        <div class="success-message" id="successMessage">
            <div class="icon">✅</div>
            <h2>预约成功！</h2>
            <p>感谢您的预约，我们将尽快与您联系。</p>
        </div>

        <div class="features">
            <h3>AI龙虾的核心优势</h3>
            <div class="feature-list">
                <div class="feature-item">
                    <div class="icon">🎯</div>
                    <div class="text">智能监控</div>
                </div>
                <div class="feature-item">
                    <div class="icon">📊</div>
                    <div class="text">数据分析</div>
                </div>
                <div class="feature-item">
                    <div class="icon">💰</div>
                    <div class="text">降低成本</div>
                </div>
                <div class="feature-item">
                    <div class="icon">🚀</div>
                    <div class="text">提高产量</div>
                </div>
            </div>
        </div>

        <div class="footer">
            © 2026 AI龙虾智能养殖 | Homily Chart Malaysia
        </div>
    </div>

    <script>
        // 页面加载完成后隐藏加载层
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 500);
        });

        const form = document.getElementById('reservationForm');
        const phoneInput = document.getElementById('phone');
        const emailInput = document.getElementById('email');
        const notesInput = document.getElementById('notes');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');
        const formSection = document.getElementById('formSection');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const phone = phoneInput.value.trim();
            const email = emailInput.value.trim();
            const notes = notesInput.value.trim();

            if (!phone && !email) {
                showError('请至少填写电话/WhatsApp或邮箱中的一项');
                return;
            }

            if (email && !isValidEmail(email)) {
                showError('请输入有效的邮箱地址');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';
            errorMessage.style.display = 'none';

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        phone: phone,
                        email: email,
                        notes: notes,
                        timestamp: new Date().toISOString()
                    })
                });

                const result = await response.json();

                if (result.success) {
                    formSection.style.display = 'none';
                    successMessage.style.display = 'block';
                } else {
                    showError(result.message || '提交失败，请稍后重试');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '提交预约';
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
                submitBtn.disabled = false;
                submitBtn.textContent = '提交预约';
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
    </script>
</body>
</html>
